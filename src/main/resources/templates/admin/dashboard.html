<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin — AutoSen</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        :root{--black:#0a0a0c;--dark:#111116;--card:#16161e;--border:#2a2a38;--accent:#e63946;--teal:#2ec4b6;--gold:#f4a261;--white:#f0eff4;--muted:#7a7a96;--font-display:'Bebas Neue',sans-serif;--font-body:'DM Sans',sans-serif;--font-mono:'JetBrains Mono',monospace;}
        body{background:var(--black);color:var(--white);font-family:var(--font-body);display:grid;grid-template-columns:240px 1fr;min-height:100vh;}
        aside{background:var(--dark);border-right:1px solid var(--border);padding:2rem 1.5rem;display:flex;flex-direction:column;gap:2rem;}
        .brand{font-family:var(--font-display);font-size:1.4rem;letter-spacing:.05em;}
        .brand b{color:var(--accent);}
        .tag{font-family:var(--font-mono);font-size:.6rem;color:var(--accent);letter-spacing:.2em;margin-top:-.5rem;}
        nav{display:flex;flex-direction:column;gap:.25rem;}
        .nav-item{display:flex;align-items:center;gap:.75rem;padding:.65rem .85rem;border-radius:4px;font-size:.875rem;color:var(--muted);text-decoration:none;transition:background .2s,color .2s;}
        .nav-item:hover,.nav-item.active{background:rgba(230,57,70,.08);color:var(--white);}
        .nav-item.active{border-left:2px solid var(--accent);padding-left:.6rem;}
        .sidebar-footer{margin-top:auto;}
        .user-chip{background:var(--card);border:1px solid var(--border);padding:.75rem;border-radius:4px;font-size:.8rem;margin-bottom:.5rem;}
        .user-chip .name{font-weight:600;}
        .user-chip .role{font-family:var(--font-mono);font-size:.65rem;color:var(--accent);}
        .logout-btn{background:none;border:none;color:var(--muted);font-family:var(--font-body);font-size:.85rem;cursor:pointer;padding:.65rem .85rem;width:100%;text-align:left;display:flex;align-items:center;gap:.75rem;border-radius:4px;transition:background .2s,color .2s;}
        .logout-btn:hover{background:rgba(230,57,70,.08);color:var(--accent);}
        main{padding:2.5rem;overflow-y:auto;}
        .page-title{font-family:var(--font-display);font-size:2rem;letter-spacing:.03em;margin-bottom:2rem;}
        .page-title span{color:var(--accent);}
        .section-title{font-family:var(--font-display);font-size:1.3rem;letter-spacing:.05em;margin-bottom:1rem;padding-bottom:.5rem;border-bottom:1px solid var(--border);}
        .cliente-card{background:var(--card);border:1px solid var(--border);border-radius:4px;margin-bottom:1.5rem;overflow:hidden;}
        .cliente-head{padding:1.25rem 1.5rem;display:flex;justify-content:space-between;align-items:center;background:var(--dark);border-bottom:1px solid var(--border);}
        .cliente-name{font-weight:700;}
        .cliente-correo{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);margin-top:.2rem;}
        .vehiculo-block{padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);}
        .vehiculo-block:last-child{border-bottom:none;}
        .vehiculo-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;}
        .vehiculo-name{font-weight:600;font-size:.9rem;}
        .vehiculo-meta{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);margin-top:.2rem;}
        .actions{display:flex;gap:.5rem;align-items:center;}
        .btn-edit{background:rgba(244,162,97,.1);border:1px solid rgba(244,162,97,.3);color:var(--gold);padding:.3rem .7rem;border-radius:2px;font-family:var(--font-mono);font-size:.65rem;text-decoration:none;cursor:pointer;transition:background .2s;}
        .btn-edit:hover{background:rgba(244,162,97,.2);}
        .btn-del{background:rgba(230,57,70,.1);color:var(--accent);padding:.3rem .7rem;border-radius:2px;font-family:var(--font-mono);font-size:.65rem;cursor:pointer;border:1px solid rgba(230,57,70,.3);transition:background .2s;}
        .btn-del:hover{background:rgba(230,57,70,.2);}
        .sensor-mini{display:flex;justify-content:space-between;align-items:center;background:var(--dark);padding:.6rem .85rem;border-radius:2px;font-size:.8rem;margin-bottom:.4rem;}
        .sensor-mini-name{font-family:var(--font-mono);font-size:.7rem;}
        .sensor-mini-nivel{font-family:var(--font-mono);font-size:.7rem;font-weight:700;}
        .badge-activo{font-family:var(--font-mono);font-size:.65rem;color:var(--teal);background:rgba(46,196,182,.1);padding:.3rem .7rem;border-radius:2px;}
        .badge-bloqueado{font-family:var(--font-mono);font-size:.65rem;color:var(--accent);background:rgba(230,57,70,.1);padding:.3rem .7rem;border-radius:2px;}
        .alert-ok{background:rgba(46,196,182,.1);border:1px solid rgba(46,196,182,.3);padding:.75rem 1rem;border-radius:2px;font-size:.85rem;color:var(--teal);margin-bottom:1.5rem;font-family:var(--font-mono);}
    </style>
</head>
<body>

<aside>
    <div>
        <div class="brand">Auto <b>Sen</b></div>
        <div class="tag">// admin panel</div>
    </div>
    <nav>
        <a th:href="@{/admin}" class="nav-item active">⚙️ Panel Admin</a>
        <a th:href="@{/admin/reportes}" class="nav-item">📊 Reportes</a>
    </nav>
    <div class="sidebar-footer">
        <div class="user-chip">
            <div class="name" th:text="${#authentication.name}"></div>
            <div class="role">ADMINISTRADOR</div>
        </div>
        <form method="post" th:action="@{/admin/logout}">
            <button type="submit" class="logout-btn">🚪 Cerrar sesión</button>
        </form>
    </div>
</aside>

<main>
    <h1 class="page-title">PANEL DE <span>ADMINISTRACIÓN</span></h1>

    <h2 class="section-title">👥 CLIENTES Y SUS VEHÍCULOS</h2>

    <div th:each="cliente : ${clientes}" class="cliente-card">
        <div class="cliente-head">
            <div>
                <div class="cliente-name" th:text="${cliente.nombreCliente} + ' ' + ${cliente.apellidoCliente}"></div>
                <div class="cliente-correo" th:text="${cliente.correo}"></div>
            </div>
            <div class="actions">
                <span th:class="${cliente.estado == 'activo'} ? 'badge-activo' : 'badge-bloqueado'"
                      th:text="${cliente.estado == 'activo'} ? '✓ ACTIVO' : '🔒 BLOQUEADO'"></span>
                <form method="post" th:action="@{/admin/cliente/{id}/estado(id=${cliente.idCliente})}">
                    <button type="submit" class="btn-edit"
                            th:text="${cliente.estado == 'activo'} ? 'BLOQUEAR' : 'ACTIVAR'"></button>
                </form>
            </div>
        </div>

        <div th:each="v : ${cliente.vehiculos}" class="vehiculo-block">
            <div class="vehiculo-top">
                <div>
                    <div class="vehiculo-name" th:text="'🚗 ' + ${v.nombreVehiculo} + ' — ' + ${v.marca}"></div>
                    <div class="vehiculo-meta" th:text="'Placa: ' + ${v.placa} + ' · Color: ' + ${v.color}"></div>
                </div>
                <div class="actions">
                    <form method="post" th:action="@{/admin/vehiculo/{id}/eliminar(id=${v.idVehiculo})}">
                        <button type="submit" class="btn-del"
                                onclick="return confirm('¿Eliminar este vehículo?')">ELIMINAR</button>
                    </form>
                </div>
            </div>

            <div th:each="s : ${v.sensores}" class="sensor-mini">
                <span class="sensor-mini-name" th:text="'📡 ' + ${s.nombreSensor}"></span>
                <span class="sensor-mini-nivel"
                      th:style="${s.nivel >= 70} ? 'color:#e63946' : (${s.nivel >= 40} ? 'color:#f4a261' : 'color:#2ec4b6')"
                      th:text="${s.nivel} + '%'"></span>
                <div class="actions">
                    <form method="post" th:action="@{/admin/sensor/{id}/eliminar(id=${s.idSensor})}">
                        <button type="submit" class="btn-del"
                                onclick="return confirm('¿Eliminar este sensor?')">ELIMINAR</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
