{% load autosen %}<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editar Vehículo — AutoSen</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0c;--surface:#14141c;--surface2:#1d1d28;--border:rgba(255,255,255,.09);--border2:rgba(255,255,255,.18);--text:#f0eff4;--muted:#8f8fa3;--red:#e63946;--red2:#ff6b6b;--font-display:'Space Grotesk',sans-serif;--font-body:'Inter',sans-serif;--font-mono:'JetBrains Mono',monospace}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;padding:24px;background-image:radial-gradient(40rem 24rem at 50% -10%,rgba(230,57,70,.16),transparent 65%)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;max-width:620px;margin:0 auto 22px}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.35rem}
.brand b{color:var(--red)}
.back{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);border:1px solid var(--border2);padding:.5rem .9rem;border-radius:10px;transition:.25s}
.back:hover{color:#fff;border-color:var(--red)}
.tarjeta{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:34px;width:100%;max-width:620px;margin:0 auto}
h1{font-family:var(--font-display);font-weight:700;font-size:1.7rem;letter-spacing:-.01em;margin-bottom:4px}
.sub{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);margin-bottom:22px}
label{display:block;margin-bottom:16px;color:var(--muted);font-size:.88rem}
input,select{background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:12px;padding:12px 14px;font:inherit;width:100%;margin-top:6px}
input:focus,select:focus{outline:2px solid var(--red);border-color:transparent}
.ayuda{color:var(--muted);font-size:.78rem;margin-top:5px}
.error{border:1px solid rgba(230,57,70,.45);color:var(--red2);padding:12px 16px;border-radius:12px;margin-bottom:18px;font-size:.88rem;background:rgba(230,57,70,.08)}
.fila{display:flex;gap:10px;margin-top:24px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;text-align:center;padding:13px;border-radius:12px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font:600 .9rem var(--font-body);cursor:pointer;transition:.25s}
.btn:hover{border-color:var(--muted)}
.btn.rojo{background:var(--red);border-color:var(--red);font-weight:700}
.btn.rojo:hover{background:#c1121f;border-color:#c1121f}
@media(max-width:560px){.tarjeta{padding:26px 20px}body{padding:16px}}
</style>
</head>
<body>
<div class="top">
  <a href="{% url 'admin_index' %}" class="brand">Auto<b>Sen</b></a>
  <a href="{% url 'admin_index' %}" class="back">← Volver al panel</a>
</div>
<div class="tarjeta">
  <h1>Editar vehículo</h1>
  <p class="sub">Actualizando {{ vehiculo.nombre_vehiculo|java }}</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="{% url 'admin_vehiculo_editar' vehiculo.id_vehiculo %}">{% csrf_token %}
    <label>Propietario
      <select name="clienteId" required>
        <option value="">Sin asignar / selecciona...</option>
        {% for c in clientes %}<option value="{{ c.id_cliente }}"{% if vehiculo.cliente_id == c.id_cliente %} selected{% endif %}>{{ c.nombre_cliente|java }} {{ c.apellido_cliente|java }}</option>{% endfor %}
      </select>
    </label>
    <label>Nombre del vehículo<input type="text" name="nombreVehiculo" value="{{ vehiculo.nombre_vehiculo|default_if_none:"" }}" required></label>
    <label>Marca<input type="text" name="marca" value="{{ vehiculo.marca|default_if_none:"" }}" required></label>
    <label>Modelo<input type="text" name="modelo" value="{{ vehiculo.modelo|default_if_none:"" }}" placeholder="Ej.: 2020"></label>
    <label>Color<input type="text" name="color" value="{{ vehiculo.color|default_if_none:"" }}" required></label>
    <label>Placa<input type="text" name="placa" value="{{ vehiculo.placa|default_if_none:"" }}" required></label>
    <label>Tipo de placa
      <select name="tipoPlaca" required>
        <option value="particular" {% if vehiculo.tipo_placa == 'particular' %}selected{% endif %}>Particular</option>
        <option value="publico" {% if vehiculo.tipo_placa == 'publico' %}selected{% endif %}>Público</option>
      </select>
    </label>
    <label>MAC del ELM327 (opcional)
      <input type="text" name="elmMac" value="{{ vehiculo.elm_mac|default_if_none:"" }}" placeholder="00:1D:A5:68:98:8B">
      <div class="ayuda">Dirección Bluetooth del escáner OBD2 del vehículo.</div>
    </label>
    <div class="fila">
      <a href="{% url 'admin_index' %}" class="btn">Cancelar</a>
      <button type="submit" class="btn rojo">Guardar cambios</button>
    </div>
  </form>
</div>
</body>
</html>
