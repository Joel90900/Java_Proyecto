<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login — AutoSen</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0c;--surface:#14141c;--surface2:#1d1d28;--border:rgba(255,255,255,.09);--border2:rgba(255,255,255,.18);--text:#f0eff4;--muted:#8f8fa3;--red:#e63946;--red2:#ff6b6b;--grad:linear-gradient(135deg,#e63946,#ff6b6b);--font-display:'Space Grotesk',sans-serif;--font-body:'Inter',sans-serif;--font-mono:'JetBrains Mono',monospace}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;display:grid;place-items:center;padding:24px;background-image:radial-gradient(40rem 24rem at 50% 0%,rgba(230,57,70,.16),transparent 65%)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
.tarjeta{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:38px;width:100%;max-width:420px;text-align:center}
.marca{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--font-display);font-weight:700;font-size:1.6rem;letter-spacing:-.01em}
.logo-orb{width:42px;height:42px;border-radius:13px;background:var(--grad);display:grid;place-items:center;font-family:var(--font-mono);font-weight:700;font-size:.74rem;color:#fff;box-shadow:0 10px 26px -6px rgba(230,57,70,.55);position:relative;flex-shrink:0}
.logo-orb::after{content:"";position:absolute;inset:0;border-radius:13px;background:inherit;filter:blur(12px);opacity:.55;z-index:-1}
.marca b{color:var(--red)}
.etiqueta{font:.68rem var(--font-mono);color:var(--muted);margin:10px 0 30px;letter-spacing:.14em;text-transform:uppercase}
h1{font-size:1.5rem;margin-bottom:22px;letter-spacing:-.01em;font-family:var(--font-display)}
label{display:block;margin-bottom:16px;color:var(--muted);font-size:.9rem;text-align:left}
input{background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:12px;padding:12px 14px;font:inherit;width:100%;margin-top:6px}
input:focus{outline:2px solid var(--red);border-color:transparent}
.error{border:1px solid rgba(230,57,70,.5);color:var(--red2);padding:12px 16px;border-radius:12px;margin-bottom:18px;font-size:.88rem;background:rgba(230,57,70,.08)}
.btn{width:100%;padding:13px;border-radius:12px;border:0;background:var(--red);color:#fff;font:inherit;font-weight:700;cursor:pointer;margin-top:6px;transition:.25s}
.btn:hover{background:#c1121f}
.volver{display:block;text-align:center;margin-top:24px;color:var(--muted);font-size:.85rem;transition:.2s}
.volver:hover{color:var(--red2)}
</style>
</head>
<body>
<div class="tarjeta">
  <span class="marca"><span class="logo-orb">AS</span>Auto<b>Sen</b></span>
  <div class="etiqueta">Panel de administración</div>
  <h1>Acceso administrador</h1>

  {% if "error" in request.GET %}<div class="error">Credenciales incorrectas.</div>{% endif %}

  <form method="post" action="{% url 'admin_login' %}">{% csrf_token %}
    <label>Correo<input type="email" name="correo" placeholder="admin@autosen.com" required></label>
    <label>Contraseña<input type="password" name="contrasena" placeholder="••••••••" required></label>
    <button type="submit" class="btn">Ingresar</button>
  </form>
  <a class="volver" href="{% url 'inicio' %}">← Volver al inicio</a>
</div>
</body>
</html>
