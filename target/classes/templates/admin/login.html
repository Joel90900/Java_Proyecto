<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin Login — AutoSen</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        :root{--black:#0a0a0c;--dark:#111116;--card:#16161e;--border:#2a2a38;--accent:#e63946;--teal:#2ec4b6;--white:#f0eff4;--muted:#7a7a96;--font-display:'Bebas Neue',sans-serif;--font-body:'DM Sans',sans-serif;--font-mono:'JetBrains Mono',monospace;}
        body{background:var(--black);color:var(--white);font-family:var(--font-body);min-height:100vh;display:flex;align-items:center;justify-content:center;}
        .login-box{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:2.5rem;width:100%;max-width:400px;}
        .brand{font-family:var(--font-display);font-size:2rem;letter-spacing:.05em;margin-bottom:.25rem;}
        .brand b{color:var(--accent);}
        .tag{font-family:var(--font-mono);font-size:.6rem;color:var(--accent);letter-spacing:.2em;margin-bottom:2rem;}
        h2{font-family:var(--font-display);font-size:1.4rem;margin-bottom:1.5rem;color:var(--white);}
        .form-group{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1rem;}
        label{font-family:var(--font-mono);font-size:.6rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}
        input{background:var(--dark);border:1px solid var(--border);color:var(--white);padding:.65rem .85rem;font-family:var(--font-body);font-size:.9rem;border-radius:2px;outline:none;transition:border-color .2s;}
        input:focus{border-color:var(--accent);}
        .btn{background:var(--accent);color:#fff;border:none;padding:.75rem;width:100%;font-family:var(--font-display);font-size:1.1rem;letter-spacing:.1em;cursor:pointer;border-radius:2px;margin-top:.5rem;transition:opacity .2s;}
        .btn:hover{opacity:.85;}
        .error{background:rgba(230,57,70,.1);border:1px solid rgba(230,57,70,.3);color:var(--accent);padding:.65rem;border-radius:2px;font-family:var(--font-mono);font-size:.75rem;margin-bottom:1rem;}
    </style>
</head>
<body>
<div class="login-box">
    <div class="brand">Auto <b>Sen</b></div>
    <div class="tag">// admin panel</div>
    <h2>ACCESO ADMINISTRADOR</h2>

    <div class="error" th:if="${param.error}">Credenciales incorrectas.</div>

    <form method="post" th:action="@{/admin/login}">
        <div class="form-group">
            <label>Correo</label>
            <input type="email" name="correo" placeholder="admin@autosen.com" required>
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" name="contrasena" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn">INGRESAR</button>
    </form>
<div style="text-align:center;margin-top:1rem;">
    <a th:href="@{/}" style="font-family:var(--font-mono);font-size:.7rem;color:var(--muted);text-decoration:none;transition:color .2s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--muted)'">← Volver al inicio</a>
</div>
</div>
</body>
</html>
